name: App Update Check

on:
  schedule:
    - cron: '0 12 * * *'  # optional: daily at 12:00 UTC
  workflow_dispatch:
    inputs:
      message:
        description: The commit message to use
        required: false

permissions:
  contents: write

jobs:
  check:
    if: github.repository == 'boomboompower/tecg' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Git Credentials
        shell: bash
        run: |
          git config --global user.name 'github-bot'
          git config --global user.email '6031226+github-bot@users.noreply.github.com'
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm run build
        env:
          EXPERIMENTS_URL: ${{ secrets.EXPERIMENTS_URL }}
          EXPERIMENTS_DATA_URL: ${{ secrets.EXPERIMENTS_DATA_URL }}
          # If a workflow dispatch, and the message is 'force', then force update
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.message == 'force' && 'true' || 'false' }}

      - run: pnpm run build-step-2
      - run: pnpm run build-step-3-extended
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: 'boomboompower'
          GH_REPO: 'tecg'

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet ./src/data/latest_build.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in latest_build.json"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in latest_build.json"
          fi

      - name: Read the commit message from the commit.txt file
        id: get_commit_message
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          if [ -f "./src/data/commit.txt" ]; then
            # Use proper GitHub Actions multiline output format
            {
              echo 'commit_message<<EOF'
              cat ./src/data/commit.txt
              echo ''
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "commit_message=Update data file" >> "$GITHUB_OUTPUT"
          fi

      # Update latest_build.json with the commit message or else a default message
      - name: Push changes to previousHash.txt
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add ./src/data/latest_build.json
          git commit -m "${{ steps.get_commit_message.outputs.commit_message || 'Update latest_build.json' }}"
          git push origin HEAD:react

      - name: Done
        run: |
          echo Goodbye!
