name: App Update Check

on:
  schedule:
    - cron: '0 12 * * *'  # optional: daily at 12:00 UTC
  workflow_dispatch:
    inputs:
      message:
        description: The commit message to use
        required: false

permissions:
  contents: write

jobs:
  check:
    if: github.repository == 'boomboompower/tecg' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Git Credentials
        shell: bash
        run: |
          git config --global user.name 'github-bot'
          git config --global user.email '6031226+github-bot@users.noreply.github.com'
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/boomboompower/tecg.git

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm run build
        env:
          EXPERIMENTS_URL: ${{ secrets.EXPERIMENTS_URL }}
          EXPERIMENTS_DATA_URL: ${{ secrets.EXPERIMENTS_DATA_URL }}
          # If a workflow dispatch, and the message is 'force', then force update
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.message == 'force' && 'true' || 'false' }}

      - run: pnpm run build-step-2
      - run: pnpm run build-step-3-extended
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: 'boomboompower'
          GH_REPO: 'tecg'

      - name: Done
        run: |
          echo Goodbye!
